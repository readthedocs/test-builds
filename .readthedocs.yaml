version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3"
  commands:
    # Install mystmd
    - npm install -g mystmd
    # Build the site
    - myst build --html
    # Copy the output to Read the Docs expected location
    - mkdir -p $READTHEDOCS_OUTPUT/html/
    - cp -r _build/html/* $READTHEDOCS_OUTPUT/html/