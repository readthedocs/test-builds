version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    # NOTE: when calling `uv sync` there is no need to create the virtual environment beforehand, as `uv sync` will create it if it doesn't exist
    # create_environment:
    #   - uv venv --python `asdf which python` $READTHEDOCS_VIRTUALENV_PATH
    install:
      # NOTE: We need to set UV_PROJECT_ENVIRONMENT to make sure that uv sync uses the correct virtual environment path.
      # The UV_PROJECT_ENVIRONMENT variable will be defined by default by Read the Docs
      # and we won't need to prepend these commands with it.
      # Define UV_PYTHON to point to the Python version installed via asdf (build.tools.python)
      - UV_PYTHON=`asdf which python` UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" uv sync
    build:
      html:
        - sphinx-build -T -b html docs $READTHEDOCS_OUTPUT/html
