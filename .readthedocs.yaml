version: 2

build:
  os: ubuntu-24.04
  tools:
    python: latest

  # Create a pdf and a html file for testing,
  # using shell only
  commands:
    - mkdir -p _readthedocs/html
    - echo "Hello World" > _readthedocs/html/index.html
    - mkdir -p _readthedocs/pdf
    - echo "Hello World" > _readthedocs/pdf/index.pdf
